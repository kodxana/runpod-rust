[package]
name = "runpod"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust SDK for the Runpod API, serverless workers, and applications"
license = "Apache-2.0 AND MIT"
repository = "https://github.com/kodxana/runpod-rust"
keywords = ["runpod", "gpu", "serverless", "sdk"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
async-stream = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
futures-util = "0.3"
flate2 = "1"
getrandom = { version = "0.3", features = ["std"] }
ignore = "0.4"
percent-encoding = "2"
pep508_rs = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart", "gzip", "deflate", "brotli"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-pickle = "1.2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util", "process", "signal"] }
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
toml_edit = "0.23"
tempfile = "3"
tar = "0.4"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2", "bzip2", "lzma"] }

[dev-dependencies]
wiremock = "0.6"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
