[package]
name = "runpod"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust SDK for the Runpod API, serverless workers, and applications"
license = "Apache-2.0 AND MIT"
repository = "https://github.com/kodxana/runpod-rust"
keywords = ["runpod", "gpu", "serverless", "sdk"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
async-stream = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-pickle = "1.2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util", "process", "signal"] }
tracing = "0.1"
toml_edit = "0.23"
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
